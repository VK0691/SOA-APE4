worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format clase '$remote_addr [$time_local] "$request" status=$status backend=$upstream_addr response_time=$upstream_response_time';
    access_log logs/access.log clase;

    # Upstream con balanceo ponderado 3:1 y tolerancia a fallos
    upstream vehiculos_backend {
        server 127.0.0.1:8081 weight=3 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:8082 weight=1 max_fails=1 fail_timeout=10s;
    }

    server {
        listen       8090;
        server_name  localhost;

        # Cabeceras CORS universales para clientes web y moviles (React, PWA)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Idempotency-Key,X-Correlation-Id,X-Notification-Key,X-Service-Key' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Idempotency-Key' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 1. Endpoint local de comprobacion de salud de NGINX (sin tocar el backend)
        location /nginx-ping {
            default_type application/json;
            return 200 '{"status":"UP","service":"nginx-balanceador","puerto":8090}';
        }

        # 2. Salud de instancias Java (balanceado)
        location /actuator/health {
            proxy_pass http://vehiculos_backend;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # 3. Enrutamiento y balanceo de autenticacion OAuth2 / JWT
        location /oauth/token {
            proxy_pass http://vehiculos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # 4. Enrutamiento y balanceo de catalogo de vehiculos, identidad y reservas (Spring Boot 8081 y 8082)
        location ~ ^/api/(vehiculos|identidad|reservas) {
            proxy_pass http://vehiculos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Service-Key $http_x_service_key;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # 5. Proxy inverso hacia FastAPI para compradores y ventas (Python :8000)
        location ~ ^/api/(compradores|ventas) {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        # 6. Proxy inverso hacia el servicio de notificaciones (Spring Boot :8083)
        location /api/notificaciones {
            proxy_pass http://127.0.0.1:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Notification-Key $http_x_notification_key;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}
